<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Centro de Negocios Santiago - SERCOTEC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        html {
            scroll-behavior: smooth;
        }

        section {
            scroll-margin-top: 80px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger fixed-top">
    <div class="container">
        <a class="navbar-brand" href="#">SERCOTEC Santiago</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item"><a class="nav-link" href="#nosotros">Nosotros</a></li>
                <li class="nav-item"><a class="nav-link" href="#servicios">Servicios</a></li>
                <li class="nav-item"><a class="nav-link" href="#faq">FAQ</a></li>
                <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>

                <!-- BOTÓN MODO OSCURO -->
                <li class="nav-item ms-3">
                    <button id="themeToggle" class="btn btn-light btn-sm">
                        🌙
                    </button>
                </li>

            </ul>
        </div>
    </div>
</nav>
    <!-- HERO -->
    <section class="hero text-center text-white d-flex align-items-center">
        <div class="container">
            <h1>Impulsamos tu negocio</h1>
            <p>Acompañamiento integral para MIPYMES</p>
        </div>
    </section>

    <!-- NOSOTROS + SERVICIOS -->
    <section id="nosotros" class="container py-5">
        <div class="row align-items-start">

            <!-- Nosotros -->
            <div class="col-md-4">
                <h2 class="text-center mb-4">Nosotros</h2>
                <div id="aboutContainer"></div>
            </div>

            <!-- Servicios -->
            <div class="col-md-8">
                <h2 class="text-center mb-4" id="servicios">Servicios</h2>
                <div class="row justify-content-center" id="servicesContainer"></div>
            </div>

        </div>
    </section>

    <!-- TESTIMONIOS -->
    <section class="container py-5">
        <h2 class="text-center mb-4">Testimonios</h2>

        <div id="testimonialCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner" id="testimonialContainer"></div>

            <button class="carousel-control-prev" type="button" data-bs-target="#testimonialCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#testimonialCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
    </section>

    <!-- FAQ -->
    <section id="faq" class="bg-light py-5">
        <div class="container">
            <h2 class="text-center mb-4">Preguntas Frecuentes</h2>
            <div class="accordion" id="faqContainer"></div>
        </div>
    </section>

    <!-- CONTACTO -->
    <section id="contacto" class="container py-5">
        <h2 class="text-center mb-4">Contáctanos</h2>

        <form id="contactForm" class="needs-validation" novalidate>
            <input type="text" id="name" class="form-control mb-3" placeholder="Nombre" required>
            <input type="email" id="email" class="form-control mb-3" placeholder="Correo electrónico" required>
            <input type="text" id="contact" class="form-control mb-3" placeholder="Teléfono" required>

            <select id="service" class="form-control mb-3" required>
                <option value="">Seleccione un servicio</option>
                <option value="Desarrollo Web">Desarrollo Web</option>
                <option value="Diseño UX/UI">Diseño UX/UI</option>
                <option value="Marketing Digital">Marketing Digital</option>
                <option value="Consultoría Tecnológica">Consultoría Tecnológica</option>
                <option value="Soporte Técnico">Soporte Técnico</option>
            </select>

            <textarea id="message" class="form-control mb-3" placeholder="Mensaje" required></textarea>

            <button class="btn btn-danger w-100">Enviar</button>
        </form>
    </section>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-3">
        Manuel Rodríguez Sur 749, Santiago | centro.santiago@centrossercotec.cl
    </footer>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
