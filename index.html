<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Centro de Negocios Santiago - SERCOTEC</title>

    <!-- SEO -->
    <meta name="description"
        content="Landing page oficial del Centro de Negocios Santiago SERCOTEC. Servicios de asesoría financiera, marketing digital y apoyo empresarial para PYMES.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Preload Hero Image -->
    <link rel="preload" as="image" href="Imagenes/Negocio1.jpg">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="css/styles.css">

    <style>
        html {
            scroll-behavior: smooth;
        }

        section {
            scroll-margin-top: 80px;
        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-danger fixed-top" role="navigation">
        <div class="container">
            <a class="navbar-brand" href="#">SERCOTEC Santiago</a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Alternar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#nosotros">Nosotros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#servicios">Servicios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#faq">Preguntas Frecuentes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contacto">Contacto</a>
                    </li>

                    <!-- Botón modo oscuro -->
                    <li class="nav-item ms-3">
                        <button id="themeToggle"
                            class="btn btn-light btn-sm"
                            aria-label="Cambiar modo oscuro">
                            🌙
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ================= HERO ================= -->
    <header class="hero text-center text-white d-flex align-items-center" role="banner">
        <div class="container">
            <h1>Impulsamos tu negocio</h1>
            <p>Acompañamiento integral para PYMES</p>
        </div>
    </header>

    <!-- ================= NOSOTROS + SERVICIOS ================= -->
    <main>

        <section id="nosotros"
            class="container py-5"
            aria-labelledby="titulo-nosotros">

            <div class="row align-items-start">

                <!-- Nosotros -->
                <div class="col-md-4">
                    <h2 id="titulo-nosotros" class="text-center mb-4">Nosotros</h2>
                    <div id="aboutContainer"></div>
                </div>

                <!-- Servicios -->
                <div class="col-md-8">
                    <h2 class="text-center mb-4" id="servicios">Servicios</h2>

                    <div class="row justify-content-center" id="servicesContainer">
                        <!-- Spinner mientras carga API -->
                        <div class="text-center" id="loadingServices">
                            <div class="spinner-border text-danger"
                                role="status"
                                aria-label="Cargando servicios">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- ================= TESTIMONIOS ================= -->
        <section class="container py-5" aria-labelledby="titulo-testimonios">
            <h2 id="titulo-testimonios" class="text-center mb-4">Testimonios</h2>

            <div id="testimonialCarousel"
                class="carousel slide"
                data-bs-ride="carousel"
                aria-label="Carrusel de testimonios">

                <div class="carousel-inner" id="testimonialContainer"></div>

                <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#testimonialCarousel"
                    data-bs-slide="prev"
                    aria-label="Testimonio anterior">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#testimonialCarousel"
                    data-bs-slide="next"
                    aria-label="Siguiente testimonio">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </section>

        <!-- ================= FAQ ================= -->
        <section id="faq"
            class="bg-light py-5"
            aria-labelledby="titulo-faq">
            <div class="container">
                <h2 id="titulo-faq" class="text-center mb-4">Preguntas Frecuentes</h2>
                <div class="accordion" id="faqContainer"></div>
            </div>
        </section>

        <!-- ================= CONTACTO ================= -->
        <section id="contacto"
            class="container py-5"
            aria-labelledby="titulo-contacto">

            <h2 id="titulo-contacto" class="text-center mb-4">Contáctanos</h2>

            <form id="contactForm" novalidate>

                <!-- Honeypot anti bots -->
                <input type="text"
                    id="website"
                    name="website"
                    style="display:none"
                    tabindex="-1"
                    autocomplete="off">

                <div class="mb-3">
                    <label for="name" class="form-label">Nombre</label>
                    <input type="text" id="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="contact" class="form-label">Teléfono</label>
                    <input type="text" id="contact" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="service" class="form-label">Servicio</label>
                    <select id="service" class="form-control" required>
                        <option value="">Seleccione un servicio</option>
                        <option value="Asesoría Financiera">Asesoría Financiera</option>
                        <option value="Marketing Digital">Marketing Digital</option>
                        <option value="Innovación Empresarial">Innovación Empresarial</option>
                        <option value="Capacitación">Capacitación</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Mensaje</label>
                    <textarea id="message"
                        class="form-control"
                        rows="4"
                        required></textarea>
                </div>

                <button class="btn btn-danger w-100" type="submit">
                    Enviar
                </button>

                <!-- Mensajes accesibles -->
                <div id="formMessage"
                    class="mt-3"
                    aria-live="polite">
                </div>

            </form>
        </section>

    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="bg-dark text-white text-center p-3"
        role="contentinfo">
        Manuel Rodríguez Sur 749, Santiago |
        centro.santiago@centrossercotec.cl
    </footer>

    <!-- ================= SCRIPTS ================= -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/validation.js" defer></script>
    <script src="js/main.js" defer></script>

</body>

</html>
